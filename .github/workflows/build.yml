name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: windows-latest
            args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: Get app version
        id: app_version
        shell: bash
        run: echo "value=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> $GITHUB_OUTPUT

      - name: Build and release (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_COMMIT_HASH: ${{ github.sha }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ steps.app_version.outputs.value }}
          releaseName: BlackBoard Sync v${{ steps.app_version.outputs.value }}
          allowUpdates: true
          releaseBody: |
            ## Novità in v1.1.1

            - **Finestra semitrasparente** — effetto blur-behind nativo: Acrylic su Windows 10, Mica su Windows 11, Vibrancy su macOS.
            - **Ottimizzazione sincronizzazione** — la fase di scansione ora avviene in parallelo su tutti i corsi; eliminate le chiamate API agli istruttori non necessarie durante la sync (~20 chiamate risparmiate per 10 corsi).

            ## v1.1.0 — Riscrittura completa in Rust + Tauri v2

            Il backend è stato riscritto da zero in **Rust** con **Tauri v2**, abbandonando Electron. Footprint drasticamente ridotto, avvio più veloce, nessuna dipendenza da Node.js a runtime.

            ### Funzionalità nuove
            - **Login persistente** — credenziali e cookie di sessione salvati nel keyring nativo del sistema operativo (Windows Credential Manager / macOS Keychain). Al riavvio l'accesso avviene automaticamente senza reinserire la password.
            - **Riavvio istantaneo** — al riavvio l'app verifica la sessione con una singola chiamata API invece di rieseguire l'intero flusso SAML, rendendo il login praticamente immediato.
            - **Installer nativo** — setup `.exe` NSIS per Windows, `.dmg` per macOS.
            - **Aggiornamenti firmati** — aggiornamenti automatici verificati crittograficamente con chiavi Ed25519.

            ### Installazione su macOS
            Al primo avvio potrebbe comparire un avviso di Gatekeeper. Per avviare l'app:
            ```
            xattr -cr /Applications/BlackBoard\ Sync.app
            ```

            ---
            _Questa app non è affiliata all'Università Bocconi._
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}


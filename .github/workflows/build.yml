name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: windows-latest
            args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: Build and release (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_COMMIT_HASH: ${{ github.sha }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1.0' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('BlackBoard Sync {0}', github.ref_name) || 'BlackBoard Sync v1.1.0' }}
          releaseBody: |
            ## Novità in v1.1.0 — Riscrittura completa in Rust + Tauri v2

            Il backend è stato riscritto da zero in **Rust** con **Tauri v2**, abbandonando Electron. Footprint drasticamente ridotto, avvio più veloce, nessuna dipendenza da Node.js a runtime.

            ### Funzionalità nuove
            - **Login persistente** — credenziali e cookie di sessione salvati nel keyring nativo del sistema operativo (Windows Credential Manager / macOS Keychain). Al riavvio l'accesso avviene automaticamente senza reinserire la password.
            - **Riavvio istantaneo** — al riavvio l'app verifica la sessione con una singola chiamata API invece di rieseguire l'intero flusso SAML, rendendo il login praticamente immediato.
            - **Installer nativo** — setup `.exe` NSIS per Windows (icona e publisher corretti), `.dmg` per macOS.
            - **Aggiornamenti firmati** — aggiornamenti automatici verificati crittograficamente con chiavi Ed25519 tramite `tauri-plugin-updater`.

            ### Miglioramenti tecnici
            - Download file con 3 worker concorrenti e supporto all'interruzione
            - Credenziali azzericate in memoria alla deallocazione (`zeroize`)
            - Singola istanza garantita: se l'app è già aperta, viene portata in primo piano
            - Stato della finestra ripristinato tra i riavvii (`tauri-plugin-window-state`)

            ### Installazione su macOS
            Al primo avvio potrebbe comparire un avviso di Gatekeeper. Per avviare l'app:
            ```
            xattr -cr /Applications/BlackBoard\ Sync.app
            ```

            ---
            _Questa app non è affiliata all'Università Bocconi._
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

